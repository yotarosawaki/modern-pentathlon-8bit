<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>近代五種 8BIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--plate:#8a1c1c;--plate2:#6a1212;--gold:#d8b45a;--cream:#efe6d2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#151515;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"DotGothic16",monospace}
#wrap{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;
  grid-template-areas:"s s" "l r";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:linear-gradient(#262626,#111)}
#screen{grid-area:s;justify-self:center;margin-top:8px;
  width:min(100vw,calc((100vh - 230px) * 1.0667));width:min(100vw,calc((100dvh - 230px) * 1.0667));
  aspect-ratio:256/240;background:#000;border:4px solid #000;border-radius:4px;box-shadow:0 0 0 2px #3a3a3a,0 6px 20px #000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#plate{grid-row:2;grid-column:1/3;margin:10px 8px 8px;border-radius:18px;
  background:linear-gradient(var(--plate),var(--plate2));box-shadow:inset 0 2px 0 #b83030,inset 0 -3px 0 #400808,0 4px 12px #000}
#plate::before{content:"MODERN PENTATHLON";display:block;text-align:center;color:var(--gold);font-size:12px;letter-spacing:3px;padding-top:8px;opacity:.85}
.side{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:22px 0 10px}
#left{grid-area:l}#right{grid-area:r}
#dpad{position:relative;width:138px;height:138px;border-radius:50%;background:radial-gradient(#5a1010 60%,transparent 62%)}
#dpad .h,#dpad .v{position:absolute;background:#1c1c1c;border-radius:6px;box-shadow:0 3px 0 #000,inset 0 1px 0 #444}
#dpad .h{left:12px;right:12px;top:50%;height:42px;margin-top:-21px}
#dpad .v{top:12px;bottom:12px;left:50%;width:42px;margin-left:-21px}
#dpad .c{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#111;box-shadow:inset 0 1px 2px #000}
#dpad i{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.5}
#dpad .au{left:50%;top:20px;margin-left:-7px;border-bottom-color:#888;border-top:0}
#dpad .ad{left:50%;bottom:20px;margin-left:-7px;border-top-color:#888;border-bottom:0}
#dpad .al{top:50%;left:20px;margin-top:-7px;border-right-color:#888;border-left:0}
#dpad .ar{top:50%;right:20px;margin-top:-7px;border-left-color:#888;border-right:0}
#dpad.tl{transform:rotate(-4deg)}#dpad.tr{transform:rotate(4deg)}
.ab{display:flex;gap:16px;align-items:center}
.btn{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5a4a,#c0201a 60%,#7a0e0a);
  box-shadow:0 5px 0 #3a0505,0 7px 10px #000;display:flex;align-items:center;justify-content:center;position:relative}
.btn span{position:absolute;bottom:-24px;color:var(--gold);font-size:16px}
.btn.on{transform:translateY(4px);box-shadow:0 1px 0 #3a0505,0 2px 4px #000;filter:brightness(1.15)}
.pill{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px}
.pill i{display:block;width:46px;height:14px;border-radius:7px;background:#2a2a2a;box-shadow:0 2px 0 #000,inset 0 1px 0 #555}
.pill span{color:var(--gold);font-size:10px;letter-spacing:1px}
.pill.on i{transform:translateY(2px);box-shadow:none}
@media (orientation:landscape){
  #wrap{grid-template-columns:1fr auto 1fr;grid-template-rows:1fr;grid-template-areas:"l s r"}
  #screen{align-self:center;margin:0;width:auto;
    height:min(calc(100vh - 16px),calc((100vw - 330px) * 0.9375));height:min(calc(100dvh - 16px),calc((100vw - 330px) * 0.9375))}
  #plate{display:none}
  .side{padding:0}
  #dpad{width:128px;height:128px}
  .btn{width:62px;height:62px}
}
@media (orientation:portrait) and (max-height:640px){
  #dpad{width:118px;height:118px}.btn{width:60px;height:60px}.side{gap:12px;padding-top:18px}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="screen" data-b="a"><canvas id="c" width="512" height="480"></canvas></div>
  <div id="plate"></div>
  <div id="left" class="side">
    <div id="dpad" data-b="dpad"><div class="h"></div><div class="v"></div><div class="c"></div>
      <i class="au"></i><i class="ad"></i><i class="al"></i><i class="ar"></i></div>
    <div class="pill" data-b="select"><i></i><span>SELECT</span></div>
  </div>
  <div id="right" class="side">
    <div class="ab"><div class="btn" data-b="b"><span>B</span></div><div class="btn" data-b="a"><span>A</span></div></div>
    <div class="pill" data-b="start"><i></i><span>START</span></div>
  </div>
</div>
<script>
'use strict';
// ================= 基本 =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;
const W=256,H=240,FONT='"DotGothic16",monospace';
const P={k:'#000000',w:'#fcfcfc',lg:'#bcbcbc',g:'#7c7c7c',dg:'#404040',r:'#d82800',dr:'#881400',pk:'#f878f8',o:'#f87858',
  y:'#f8b800',ly:'#f8d878',sk:'#f8b878',dsk:'#c87850',br:'#ac7c00',dbr:'#503000',b:'#0058f8',lb:'#3cbcfc',sky:'#a4e4fc',
  db:'#0000bc',gr:'#00a800',lgr:'#58d854',dgr:'#005800',ygr:'#b8f818',pu:'#6844fc',lit:'#00e800'};
let frame=0;
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>v<a?a:v>b?b:v;
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
function L(x0,y0,x1,y1,c,t=1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,o=Math.floor(t/2);let e=dx-dy;ctx.fillStyle=c;
  for(let i=0;i<700;i++){ctx.fillRect(x0-o,y0-o,t,t);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx;}if(e2<dx){e+=dx;y0+=sy;}}}
function CIRC(cx,cy,r,c){ctx.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y+r*0.6));ctx.fillRect(cx-w,cy+y,w*2+1,1);}}
function RING(cx,cy,r,c){ctx.fillStyle=c;const n=Math.max(16,Math.ceil(r*7));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;ctx.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1);}}
function T(s,x,y,c=P.w,al='left',sz=8,sh=true){ctx.font=sz+'px '+FONT;ctx.textAlign=al;ctx.textBaseline='top';
  if(sh){ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);}ctx.fillStyle=c;ctx.fillText(s,x,y);}
function BOX(x,y,w,h,bg=P.k,bd=P.w){R(x,y,w,h,bg);R(x+2,y+2,w-4,1,bd);R(x+2,y+h-3,w-4,1,bd);R(x+2,y+2,1,h-4,bd);R(x+w-3,y+2,1,h-4,bd);}
const wrapCache=new Map();
function wrap(s,maxW,sz=8){const key=s+'|'+maxW+'|'+sz;if(wrapCache.has(key))return wrapCache.get(key);ctx.font=sz+'px '+FONT;
  const out=[];let line='';for(const ch of s){if(ch==='\n'){out.push(line);line='';continue;}if(ctx.measureText(line+ch).width>maxW){out.push(line);line=ch;}else line+=ch;}
  if(line)out.push(line);if(document.fonts&&document.fonts.status==='loaded')wrapCache.set(key,out);return out;}
function fmt(s){const c=Math.floor(s*100),m=Math.floor(c/6000),sec=Math.floor(c/100)%60,cs=c%100;return m+':'+String(sec).padStart(2,'0')+'.'+String(cs).padStart(2,'0');}
function fmtS(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function HEART(x,y,c,big){const rows=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];const s=big?2:1;
  ctx.fillStyle=c;rows.forEach((r,j)=>{for(let i=0;i<7;i++)if(r[i]==='X')ctx.fillRect(x+i*s-(big?3:0),y+j*s-(big?3:0),s,s);});}
function bar(x,y,w,h,v,c,bg='#303030'){R(x,y,w,h,P.w);R(x+1,y+1,w-2,h-2,bg);R(x+1,y+1,Math.round((w-2)*clamp(v,0,1)),h-2,c);}
const blink=(n=30)=>Math.floor(frame/n)%2===0;
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('mp8_'+k));localStorage.setItem('mp8_'+k,JSON.stringify(v));}catch(e){return null;}}

// ================= 入力 =================
const KEYS=['up','down','left','right','a','b','start','select'];
const kb={},tc={},held={},prs={},latch={};
function press(k){latch[k]=true;ensureAudio();}
const KMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',
  KeyX:'a',KeyL:'a',Space:'a',KeyZ:'b',KeyK:'b',Enter:'start',ShiftLeft:'select',ShiftRight:'select',KeyC:'select'};
addEventListener('keydown',e=>{const k=KMAP[e.code];if(!k)return;e.preventDefault();if(!e.repeat&&!kb[k])press(k);kb[k]=true;});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k)kb[k]=false;});
addEventListener('blur',()=>{for(const k of KEYS)kb[k]=false;});
const ptrs={};
const dpadEl=document.getElementById('dpad');
function ptrUpdate(e){const el=document.elementFromPoint(e.clientX,e.clientY);const t=el&&el.closest('[data-b]');const p={b:t?t.dataset.b:null,dirs:[]};
  if(p.b==='dpad'){const r=t.getBoundingClientRect();const dx=(e.clientX-(r.left+r.width/2))/r.width,dy=(e.clientY-(r.top+r.height/2))/r.height,dz=0.08;
    if(dx<-dz&&Math.abs(dx)>Math.abs(dy)*0.45)p.dirs.push('left');if(dx>dz&&Math.abs(dx)>Math.abs(dy)*0.45)p.dirs.push('right');
    if(dy<-dz&&Math.abs(dy)>Math.abs(dx)*0.45)p.dirs.push('up');if(dy>dz&&Math.abs(dy)>Math.abs(dx)*0.45)p.dirs.push('down');}
  ptrs[e.pointerId]=p;recomputeTouch();}
function recomputeTouch(){const n={};for(const id in ptrs){const p=ptrs[id];if(p.b==='dpad')p.dirs.forEach(d=>n[d]=true);else if(p.b)n[p.b]=true;}
  for(const k of KEYS){if(n[k]&&!tc[k])press(k);tc[k]=!!n[k];}
  document.querySelectorAll('[data-b]').forEach(el=>{const b=el.dataset.b;if(el.classList.contains('btn')||el.classList.contains('pill'))el.classList.toggle('on',!!tc[b]);});
  dpadEl.classList.toggle('tl',!!(tc.left));dpadEl.classList.toggle('tr',!!(tc.right));}
document.addEventListener('pointerdown',e=>{e.preventDefault();ptrUpdate(e);},{passive:false});
document.addEventListener('pointermove',e=>{if(ptrs[e.pointerId])ptrUpdate(e);},{passive:false});
const ptrEnd=e=>{delete ptrs[e.pointerId];recomputeTouch();};
document.addEventListener('pointerup',ptrEnd);document.addEventListener('pointercancel',ptrEnd);
document.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
function pollInput(){for(const k of KEYS){held[k]=!!(kb[k]||tc[k]);prs[k]=!!latch[k];latch[k]=false;}}

// ================= サウンド =================
let AC=null,muted=store('mute')===true,noiseBuf=null;
function ensureAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();
  noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='square',v=0.06,slide=0,delay=0,list){if(!AC||muted)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+d*0.7);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+0.02);if(list)list.push(o);}
function noise(d,v=0.08,delay=0,hp=800){if(!AC||muted||!noiseBuf)return;const t=AC.currentTime+delay;const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+d+0.02);}
const sfx={
  sel:()=>tone(660,0.05,'square',0.05),ok:()=>{tone(880,0.06,'square',0.05);tone(1320,0.1,'square',0.05,0,0.06);},
  tap:()=>noise(0.04,0.05,0,2500),step:()=>tone(90,0.04,'triangle',0.12),
  lunge:()=>{tone(320,0.08,'square',0.04,-200);noise(0.06,0.04,0,3000);},parry:()=>noise(0.07,0.06,0,4000),
  clang:()=>{tone(1900,0.09,'square',0.04);tone(2600,0.16,'triangle',0.06,0,0.01);},
  buzz:()=>tone(330,0.45,'sawtooth',0.05),beep:()=>tone(440,0.15,'square',0.05),go:()=>tone(880,0.4,'square',0.06),
  jump:()=>tone(220,0.18,'square',0.04,400),land:()=>tone(80,0.06,'triangle',0.15),
  crash:()=>{noise(0.35,0.12,0,300);tone(160,0.25,'square',0.04,-100);},clear:()=>{tone(1047,0.05,'square',0.03);tone(1568,0.08,'square',0.03,0,0.05);},
  hit:()=>{tone(1568,0.08,'square',0.04);tone(2093,0.14,'square',0.04,0,0.06);},miss:()=>tone(140,0.14,'square',0.05),
  shot:()=>noise(0.03,0.05,0,5000),breath:()=>noise(0.25,0.05,0,600),cheer:()=>{noise(1.0,0.05,0,1200);},
  bad:()=>{tone(300,0.1,'square',0.05);tone(200,0.2,'square',0.05,0,0.1);},
};
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nf(n){const m=n.match(/^([A-G])(#?)(\d)$/);const mi=12*(+m[3]+1)+NOTE[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(mi-69)/12);}
const SONG={
  title:{bpm:150,loop:true,tr:[{t:'square',v:0.035,n:'E5:1 G5:1 C6:2 B5:1 G5:1 E5:2 F5:1 A5:1 D6:2 C6:1 A5:1 F5:2 G5:1 B5:1 D6:1 G6:1 F6:1 D6:1 B5:1 G5:1 C6:2 G5:2 C6:4'},
    {t:'triangle',v:0.09,n:'C3:2 G3:2 C3:2 G3:2 F3:2 C4:2 F3:2 C4:2 G3:2 D4:2 G3:2 D4:2 C3:2 G3:2 C3:4'}]},
  race:{bpm:170,loop:true,tr:[{t:'square',v:0.022,n:'A4:1 A4:1 E5:1 A4:1 G5:1 A4:1 E5:1 D5:1 F4:1 F4:1 C5:1 F4:1 E5:1 F4:1 C5:1 B4:1 G4:1 G4:1 D5:1 G4:1 F5:1 G4:1 D5:1 C5:1 E4:1 E4:1 B4:1 E4:1 G#4:1 B4:1 E5:2'},
    {t:'triangle',v:0.08,n:'A2:2 A3:2 A2:2 A3:2 F2:2 F3:2 F2:2 F3:2 G2:2 G3:2 G2:2 G3:2 E2:2 E3:2 E2:2 E3:2'}]},
  fan:{bpm:140,loop:false,tr:[{t:'square',v:0.045,n:'C5:1 E5:1 G5:1 C6:3 G5:1 C6:4'},{t:'triangle',v:0.09,n:'C3:1 C3:1 C3:1 G3:3 G3:1 C3:4'}]},
};
const Music={cur:null,nodes:[],timer:null,
  play(s){if(this.cur===s)return;this.stop();this.cur=s;this.run();},
  run(){clearTimeout(this.timer);const s=this.cur;if(!s)return;if(!AC||muted||AC.state!=='running'){this.timer=setTimeout(()=>this.run(),400);return;}
    const e8=60/s.bpm/2,t0=0.05;let len=0;
    for(const tr of s.tr){let t=t0;for(const tok of tr.n.split(' ')){const[n,l]=tok.split(':');const d=+l*e8;if(n!=='R')tone(nf(n),d*0.9,tr.t,tr.v,0,t,this.nodes);t+=d;}len=Math.max(len,t);}
    if(s.loop)this.timer=setTimeout(()=>{this.nodes=[];this.run();},(len-t0)*1000-30);else this.timer=setTimeout(()=>{this.nodes=[];this.cur=null;},len*1000);},
  halt(){clearTimeout(this.timer);this.nodes.forEach(n=>{try{n.stop();}catch(e){}});this.nodes=[];},
  stop(){this.halt();this.cur=null;},
  resume(){if(this.cur){this.halt();this.run();}}};
let toast={s:'',t:0};
function toggleMute(){muted=!muted;store('mute',muted);if(muted)Music.halt();else{ensureAudio();Music.resume();}toast={s:muted?'サウンド OFF':'サウンド ON',t:90};}

// ================= スプライト（手続き描画） =================
function handOff(a){switch(a.st){case 'wind':return 4;case 'lunge':return Math.min(15,9+a.t*2);case 'recover':return 12;case 'parry':return 8;case 'stun':return 6;default:return 9;}}
const tipX=a=>a.x+a.f*(handOff(a)+16);
function drawFencer(a,gy,acc,wire){
  const f=a.f,x=Math.round(a.x);
  const lg=a.st==='lunge'?Math.min(1,a.t/3):a.st==='recover'?Math.max(0,1-a.t/10):0;
  const wk=(a.st==='idle'&&Math.floor(a.walk/5)%2)?1:0;
  const hipY=gy-15+Math.round(lg*3);
  const bk={x:x-f*(5+lg*3),y:gy-8},bf={x:x-f*(8+lg*5)+f*wk,y:gy-2};
  const fk={x:x+f*(6+lg*6),y:gy-9+lg*2},ff={x:x+f*(8+lg*10)-f*wk,y:gy-2};
  if(wire){const ex=f>0?-2:258;L(x-f*3,hipY-6,x-f*16,gy-3,'#181818',1);L(x-f*16,gy-3,ex,gy-6,'#181818',1);}
  L(x,hipY,bk.x,bk.y,P.w,3);L(bk.x,bk.y,bf.x,bf.y,P.w,3);
  L(x,hipY,fk.x,fk.y,P.w,3);L(fk.x,fk.y,ff.x,ff.y,P.w,3);
  R(bf.x-1,gy-5,3,3,acc);R(ff.x-1,gy-5,3,3,acc);
  R(bf.x-2,gy-2,5,2,P.dg);R(ff.x-2+f,gy-2,5,2,P.dg);
  const sx=x+f*Math.round(1+lg*4),sy=gy-27+Math.round(lg*3);
  L(x,hipY,sx,sy+2,P.w,6);
  const hx=sx+f*2,hy=sy-8;
  R(hx-3,hy,7,7,P.lg);R(f>0?hx:hx-3,hy+1,4,5,P.dg);R(f>0?hx+1:hx-2,hy+2,2,1,P.g);R(f>0?hx+1:hx-2,hy+4,2,1,P.g);R(hx-3,hy+6,7,2,P.w);
  if(lg>0.5){L(sx-f,sy+1,sx-f*7,sy+6,P.w,2);L(sx-f*7,sy+6,sx-f*12,sy+9,P.w,2);}
  else{L(sx-f,sy+1,sx-f*6,sy-2,P.w,2);L(sx-f*6,sy-2,sx-f*4,sy-8,P.w,2);}
  const ho=handOff(a),hX=x+f*ho,hY=sy+4;
  L(sx+f,sy+1,hX,hY,P.w,2);
  if(a.st==='parry')L(hX,hY,hX+f*10,hY-13,'#e8e8e8',1);else L(hX,hY,x+f*(ho+16),hY-1,'#e8e8e8',1);
  R(hX-1,hY-1,3,3,acc);R(f>0?hX+1:hX-2,hY-3,2,6,P.lg);
}
function drawSwimmer(x,y,d,cap,st,breath,v,under){
  x=Math.round(x);y=Math.round(y);

function stepF(a,c){a.t++;
  switch(a.st){
    case 'idle':if(c.atk){a.st='wind';a.t=0;a.wl=c.windLen;break;}if(c.par){a.st='parry';a.t=0;sfx.parry();break;}
      if(c.move){a.x+=c.move*c.speed;a.walk+=c.speed;}break;
    case 'wind':if(a.t>=a.wl){a.st='lunge';a.t=0;a.done=false;sfx.lunge();}break;
    case 'lunge':if(a.t<=8)a.x+=a.f*1.8;if(a.t>=12){a.st='recover';a.t=0;}break;
    case 'recover':if(a.t<=10)a.x-=a.f*1.2;if(a.t>=18){a.st='idle';a.t=0;}break;
    case 'parry':if(a.t>=16){a.st='idle';a.t=0;}break;
    case 'stun':if(a.t<12)a.x-=a.f*0.5;if(a.t>=a.sl){a.st='idle';a.t=0;}break;}}
const Fence={play:true,
  init(){this.bout=0;this.res=[];this.crowd=[];

  say(m,t=60){this.msg=m;this.msgT=t;},
  update(){this.t++;if(this.cheer>0)this.cheer--;if(this.spark>0)this.spark--;if(this.msgT>0)this.msgT--;
    if(this.ph==='ready'){if(this.t===2||this.t===45)sfx.beep();if(this.t>=85){this.ph='fight';this.t=0;sfx.go();}return;}
    if(this.ph==='touch'){if(this.t>=120){this.bout++;if(this.bout>=10)this.finish();else this.newBout();}return;}
    this.timer--;const p=this.p,c=this.c;
    const pc={move:(held.right?1:0)-(held.left?1:0),atk:prs.a,par:prs.b,speed:1.1,windLen:3};
    const cc=this.aiCtl();

// ================= 種目4: レーザーラン =================
const PXM=6;
const Laser={play:true,
  init(){this.leg=0;this.hr=92;this.total=0;this.t=0;this.hitsAll=0;this.shotsAll=0;this.legs=[];this.msg='';this.msgT=0;this.startShoot();Music.stop();},
  say(m,t=60){this.msg=m;this.msgT=t;},
  startShoot(){this.ph='shoot';this.st=0;this.hits=0;this.shots=0;this.cool=0;this.off={x:rnd(-25,25),y:rnd(-20,20)};this.stam=100;this.flash=0;this.leave=0;this.lastMiss=0;this.side=[0,0];Music.stop();},
  startRun(){this.ph='run';this.dist=0;this.v=0;this.last=null;this.anim=0;Music.play(SONG.race);},
  cross(){const steady=held.b&&this.stam>0;const amp=(2+(this.hr-60)*0.12)*(steady?0.35:1);const t=this.t;
    return{x:128+this.off.x+amp*(Math.sin(t*0.07)+0.5*Math.sin(t*0.173+1)),y:112+this.off.y+amp*(Math.sin(t*0.053+2)+0.5*Math.cos(t*0.137)),steady};},
  update(){this.t++;if(this.msgT>0)this.msgT--;
    if(this.ph==='shoot'){this.st++;this.total+=1/60;this.hr+=(68-this.hr)*0.0016;
      if(held.b&&this.stam>0)this.stam=Math.max(0,this.stam-1.1);else if(!held.b)this.stam=Math.min(100,this.stam+0.45);
      const m=0.7;if(held.left)this.off.x-=m;if(held.right)this.off.x+=m;if(held.up)this.off.y-=m;if(held.down)this.off.y+=m;
      this.off.x+=Math.sin(this.t*0.011+this.leg*2)*0.12;this.off.y+=Math.cos(this.t*0.009+this.leg)*0.12;
      this.off.x=clamp(this.off.x,-60,60);this.off.y=clamp(this.off.y,-50,50);
      if(this.cool>0)this.cool--;if(this.flash>0)this.flash--;
      for(let i=0;i<2;i++)if(Math.random()<0.012)this.side[i]=20;this.side=this.side.map(v=>Math.max(0,v-1));
      if(prs.a&&this.cool===0&&this.hits<5&&!this.leave){const c=this.cross();this.shots++;this.shotsAll++;this.cool=22;sfx.shot();
        if(Math.hypot(c.x-128,c.y-112)<=11){this.hits++;this.hitsAll++;this.flash=20;sfx.hit();}else{this.lastMiss=20;sfx.miss();}}
      if(this.lastMiss>0)this.lastMiss--;
      if(!this.leave&&(this.hits>=5||this.st>=50*60)){this.leave=50;this.say(this.hits>=5?'5発命中！ ラン開始！':'50秒たった！ 走れ！',50);}
      if(this.leave&&--this.leave===0){this.legs.push({hits:this.hits,shots:this.shots,shoot:this.st/60});this.startRun();}}
    else if(this.ph==='run'){
      const ks=[];if(prs.a)ks.push('a');if(prs.b)ks.push('b');if(ks.length===2&&this.last==='b')ks.reverse();
      for(const k of ks){if(this.last!==k){this.v+=1.3;this.last=k;sfx.tap();}}
      this.v*=0.96;this.v=Math.min(this.v,5.0);this.dist+=this.v*8/60;this.total+=8/60;this.anim+=0.05+this.v*0.055;
      this.hr+=(60+this.v*24-this.hr)*0.012;
      if(this.dist>=600){this.dist=600;this.leg++;if(this.leg>=4){this.ph='finish';this.ft=0;Music.stop();sfx.go();sfx.cheer();}else{this.startShoot();this.say(`射撃 ${this.leg+1}/4`,60);}}}
    else{this.ft++;this.hr+=(80-this.hr)*0.01;if(this.ft>150)this.finish();}},
  finish(){finishEvent(3,500+(740-this.total),[`タイム ${fmtS(this.total)}`,`命中 ${this.hitsAll}/${this.shotsAll}発`,'12:20=500点 1秒ごとに±1点']);},
  drawTarget(cx,cy,s,lit){R(cx-34*s,cy-34*s,68*s,68*s,'#e8e8e8');CIRC(cx,cy,Math.round(28*s),P.k);RING(cx,cy,Math.round(20*s),'#707070');RING(cx,cy,Math.round(11*s),P.w);R(cx-1,cy-1,2,2,P.w);
    R(cx-6*s,cy-46*s,12*s,8*s,P.dg);R(cx-5*s+1,cy-45*s+1,10*s-2,6*s-2,lit?P.lit:'#003000');},
  draw(){
    if(this.ph==='shoot'){R(0,0,W,H,'#5c3c1c');for(let x=0;x<W;x+=16)R(x,34,1,170,'#4a2c10');R(0,34,W,10,'#303030');
      this.drawTarget(36,112,0.5,this.side[0]>0);this.drawTarget(220,112,0.5,this.side[1]>0);this.drawTarget(128,112,1,this.flash>0);
      const c=this.cross();const cx=Math.round(c.x),cy=Math.round(c.y),col=c.steady?P.ygr:'#f83800';
      RING(cx,cy,6,col);L(cx-12,cy,cx-8,cy,col);L(cx+8,cy,cx+12,cy,col);L(cx,cy-12,cx,cy-8,col);L(cx,cy+8,cx,cy+12,col);R(cx,cy,1,1,col);
      const px=cx+10,py=cy+52;R(px+2,py+16,12,80,P.r);R(px-4,py+2,14,16,P.sk);R(px-2,py-8,8,22,'#303030');R(px+1,py-11,2,3,'#303030');
      if(this.lastMiss>0)T('MISS',128,66,P.r,'center');
      if(this.flash>0)T('HIT!',128,66,P.lit,'center');}
    else{const off=this.dist*PXM;
      R(0,0,W,H,P.sky);for(let i=0;i<10;i++){const x=((i*60-off*0.15)%600+600)%600-60;CIRC(x,122,20+(i%3)*5,P.dgr);}
      R(0,118,W,34,P.gr);for(let i=0;i<8;i++){const x=((i*70-off*0.5)%560+560)%560-30;R(x+8,108,4,30,P.dbr);CIRC(x+10,104,10,'#108010');}
      R(0,150,W,52,'#c84c0c');R(0,150,W,1,P.w);R(0,170,W,1,'#f8b878');R(0,200,W,1,P.w);
      for(let m=0;m<=600;m+=100){const x=96+(m-this.dist)*PXM;if(x>-20&&x<280){R(x,142,2,12,P.w);T(m+'m',x,132,P.w,'center');}}
      const gx=96+(600-this.dist)*PXM;if(gx<300){R(gx,150,2,52,P.w);if(this.leg>=3||this.ph==='finish'){R(gx-2,104,4,48,P.w);R(gx+2,104,40,12,P.r);T('GOAL',gx+22,106,P.w,'center',8,false);}else{R(gx+6,112,46,14,P.b);T('射撃場',gx+29,115,P.w,'center',8,false);}}
      drawRunner(96,190,this.ph==='finish'?this.t*0.15:this.anim,P.r);
      if(this.ph==='finish'){BOX(48,60,160,40);T('FINISH!',128,66,P.y,'center',16);T(fmtS(this.total),128,86,P.w,'center');}}
    BOX(0,0,W,34);
    T(this.ph==='shoot'?`射撃 ${this.leg+1}/4`:this.ph==='run'?`ラン ${this.leg+1}/4`:'FINISH',8,5,P.y);
    T('TOTAL '+fmtS(this.total),96,5,P.w);
    const beat=(this.t*this.hr/3600)%1<0.15;HEART(196,8,P.r,beat);T(Math.round(this.hr)+'',248,5,this.hr>150?P.r:P.w,'right');
    if(this.ph==='shoot'){for(let i=0;i<5;i++)CIRC(14+i*14,24,5,i<this.hits?P.lit:'#304030');T((this.st/60).toFixed(1)+'s / 50s',248,19,this.st>40*60?P.r:P.lg,'right');}
    else{bar(8,21,240,8,(this.dist||0)/600,P.y);R(8+Math.round(238*(this.dist||0)/600)-1,19,3,12,P.r);}
    BOX(0,204,W,36);
    if(this.msgT>0)T(this.msg,128,214,P.y,'center');
    else if(this.ph==='shoot'){T('十字キー:照準 A:うつ',8,210,P.lg);T('B長押し:息止め',8,222,P.lg);T('いき',150,216,P.w);bar(172,217,76,8,this.stam/100,this.stam<30?P.r:P.lb);}
    else if(this.ph==='run'){T('A・B こうごに連打！',8,210,P.lg);T('心拍が高いと照準がブレる',8,222,P.ly);T('SPEED',150,210,P.w);bar(150,222,98,8,this.v/5.0,P.y);}}
};

// ================= メインループ =================
function step(){pollInput();
  if(prs.select)toggleMute();
  if(S.play&&prs.start&&!paused){paused=true;Music.halt();sfx.sel();return;}
  if(paused){if(prs.start||prs.a){paused=false;Music.resume();sfx.sel();}else if(prs.b){paused=false;Music.stop();go(Title);}return;}
  S.update();}
function render(){S.draw();
  if(paused){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);BOX(48,80,160,72);T('PAUSE',128,90,P.y,'center',16);T('A/START : つづける',128,116,P.w,'center');T('B : タイトルへ',128,130,P.w,'center');}
  if(toast.t>0){toast.t--;BOX(64,104,128,26);T(toast.s,128,112,P.y,'center');}}
let last=performance.now(),acc=0;const DT=1000/60;
function loop(now){acc+=Math.min(200,now-last);last=now;let n=0;while(acc>=DT&&n<5){step();acc-=DT;frame++;n++;}if(n===5)acc=0;render();requestAnimationFrame(loop);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(S&&S.play&&!paused){paused=true;}Music.halt();}else if(!paused)Music.resume();});
go(Title);requestAnimationFrame(loop);
if(document.fonts)document.fonts.load('16px "DotGothic16"').then(()=>wrapCache.clear()).catch(()=>{});
